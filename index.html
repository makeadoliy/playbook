<title>Industry Growth Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#07090a;
    --bg-panel:#0e1210;
    --bg-panel-2:#121714;
    --line:#212b23;
    --line-bright:#3a4a3c;
    --green:#75a53a;
    --green-bright:#a4dd63;
    --green-dim:#4d6e2a;
    --ink:#f2f4ef;
    --ink-muted:#93a091;
    --ink-faint:#5c665b;
    --mono:'Manrope', ui-sans-serif, system-ui, sans-serif;
    --display:'Unbounded', ui-sans-serif, system-ui, sans-serif;
    --body:'Manrope', ui-sans-serif, system-ui, sans-serif;
    --radius:14px;
    --maxw:1240px;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg-deep);}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--green-dim); color:var(--ink);}
  a{color:inherit;}
  img{max-width:100%;}
  h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance; font-weight:800;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}

  :focus-visible{outline:2px solid var(--green-bright); outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding-inline:24px;
  }

  /* ---------- background texture (fixed, global) ---------- */
  .noise-layer{
    position:fixed; inset:0; pointer-events:none; z-index:-1;
    background-image:
      radial-gradient(ellipse 900px 500px at 18% -10%, rgba(117,165,58,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 20%, rgba(117,165,58,0.08), transparent 60%),
      linear-gradient(var(--bg-deep), var(--bg-deep));
  }
  .grid-layer{
    position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:0.35;
    background-image:
      linear-gradient(to right, rgba(117,165,58,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(117,165,58,0.055) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 100% 70% at 50% 0%, black 40%, transparent 90%);
  }

  /* ---------- top nav ---------- */
  .topnav{
    position:sticky; top:0; z-index:50;
    background:rgba(7,9,10,0.78);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{
    max-width:var(--maxw); margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .logo{display:flex; align-items:center; gap:10px; text-decoration:none; background:none; border:none; padding:0;}
  .logo-mark{
    width:16px; height:16px; flex:none;
    background:var(--green);
    clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow:0 0 14px rgba(164,221,99,0.75);
  }
  .logo-word{
    font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:0.14em;
    color:#fff;
  }
  .nav-links{display:flex; align-items:center; gap:28px; list-style:none; margin:0; padding:0;}
  .nav-links button{
    background:none; border:none; color:var(--ink-muted); font-family:var(--mono);
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase; padding:6px 2px;
    border-bottom:1px solid transparent; transition:color .2s ease, border-color .2s ease;
  }
  .nav-links button:hover, .nav-links button.active{color:var(--ink); border-color:var(--green);}
  .live-pill{
    display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px;
    letter-spacing:0.14em; color:var(--green-bright); text-transform:uppercase; white-space:nowrap;
  }
  .live-dot{width:6px; height:6px; border-radius:50%; background:var(--green-bright); box-shadow:0 0 8px var(--green-bright); animation:pulse-dot 2.2s ease-in-out infinite;}
  @keyframes pulse-dot{0%,100%{opacity:1;} 50%{opacity:.35;}}
  @media (max-width:820px){
    .topnav-inner{flex-wrap:wrap; row-gap:12px;}
    .live-pill{display:none;}
    .nav-links{order:3; width:100%; justify-content:center; gap:18px; flex-wrap:wrap; row-gap:10px;}
    .nav-links button{font-size:11px;}
  }
  @media (max-width:400px){
    .nav-links{gap:12px;}
    .nav-links button{font-size:10px;}
  }

  /* ---------- section labels ---------- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--green-bright); margin-bottom:16px;
  }
  .eyebrow::before{content:''; width:18px; height:1px; background:var(--green-bright);}

  /* ---------- views ---------- */
  .view{display:none;}
  .view.active{display:block;}

  /* ================= HOME ================= */

  .hero{position:relative; padding:96px 0 64px; overflow:hidden;}
  .hero-grid{
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:center;
  }
  .hero h1{
    font-size:clamp(2.6rem, 6vw, 4.6rem); line-height:0.98; letter-spacing:-0.01em;
    color:#fff;
  }
  .hero h1 span{color:var(--green-bright);}
  .hero-sub{
    margin-top:22px; font-size:1.15rem; color:var(--ink-muted); max-width:46ch;
  }
  .status-row{
    margin-top:32px; display:flex; flex-wrap:wrap; gap:14px 28px; align-items:center;
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--ink-muted);
  }
  .status-ready{color:var(--green-bright); display:flex; align-items:center; gap:8px;}
  .stat-strip{display:flex; gap:28px; margin-top:44px; flex-wrap:wrap;}
  .stat{font-family:var(--mono);}
  .stat b{display:block; font-family:var(--display); font-size:1.9rem; color:#fff; font-weight:700;}
  .stat span{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint);}

  .hero-visual{position:relative; aspect-ratio:1/1; max-height:440px;}
  .hero-visual canvas{width:100%; height:100%; display:block;}
  .hero-visual-ring{
    position:absolute; inset:8%; border:1px solid var(--line-bright); border-radius:50%;
    opacity:0.5;
  }

  /* ---------- explorer ---------- */
  .section{padding:80px 0;}
  .section-head{display:flex; flex-direction:column; gap:10px; margin-bottom:44px;}
  .section-head h2{font-size:clamp(1.8rem,3.4vw,2.6rem); color:#fff;}
  .section-head p{color:var(--ink-muted); max-width:56ch; font-size:1.02rem;}

  .industry-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:18px;
  }
  @media (max-width:1080px){.industry-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.industry-grid{grid-template-columns:1fr;}}

  .industry-card{
    position:relative; text-align:left; padding:26px 22px; border-radius:var(--radius);
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line);
    overflow:hidden; transition:transform .35s ease, border-color .35s ease, box-shadow .35s ease;
    display:flex; flex-direction:column; gap:14px; min-height:230px;
  }
  .industry-card::before{
    content:''; position:absolute; inset:0; padding:1px; border-radius:inherit;
    background:conic-gradient(from var(--ang,0deg), transparent 0 70%, var(--green-bright) 85%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .35s ease;
  }
  .industry-card:hover{transform:translateY(-4px); border-color:var(--line-bright); box-shadow:0 18px 40px -18px rgba(117,165,58,0.35);}
  .industry-card:hover::before{opacity:1; animation:spin-border 2.4s linear infinite;}
  @keyframes spin-border{to{--ang:360deg;}}
  @property --ang{syntax:'<angle>'; inherits:true; initial-value:0deg;}

  .industry-icon{
    width:38px; height:38px; border-radius:9px; background:rgba(117,165,58,0.12);
    border:1px solid rgba(117,165,58,0.35); display:flex; align-items:center; justify-content:center;
    color:var(--green-bright);
  }
  .industry-card h3{font-size:1.15rem; color:#fff;}
  .industry-card .sub{font-size:12.5px; color:var(--ink-faint); font-family:var(--mono);}
  .industry-card .desc{font-size:13.5px; color:var(--ink-muted); flex:1;}
  .industry-card .foot{
    display:flex; align-items:center; justify-content:space-between; font-family:var(--mono);
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint);
    padding-top:12px; border-top:1px solid var(--line);
  }
  .industry-card .foot .go{color:var(--ink-faint); transition:color .25s ease, transform .25s ease; display:flex; align-items:center; gap:6px;}
  .industry-card:hover .foot .go{color:var(--green-bright); transform:translateX(2px);}

  /* ---------- growth system flow ---------- */
  .flow-wrap{position:relative; padding:46px 0 10px;}
  .flow-track{
    display:grid; grid-template-columns:repeat(7,1fr); gap:0; position:relative;
  }
  .flow-line{
    position:absolute; left:0; right:0; top:19px; height:2px; background:var(--line);
    z-index:0;
  }
  .flow-line-glow{
    position:absolute; top:0; left:0; height:2px; width:40%; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--green-bright), transparent);
    animation:travel 5s linear infinite;
    box-shadow:0 0 10px var(--green-bright);
  }
  @keyframes travel{0%{left:-40%;} 100%{left:100%;}}
  .flow-step{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:0 6px;}
  .flow-node{
    width:40px; height:40px; border-radius:50%; background:var(--bg-panel-2); border:1px solid var(--green-dim);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; color:var(--green-bright);
  }
  .flow-step h4{font-size:13px; letter-spacing:0.08em; color:var(--ink); text-transform:uppercase; font-family:var(--mono); font-weight:600;}
  @media (max-width:900px){
    .flow-track{grid-template-columns:1fr; gap:28px;}
    .flow-line, .flow-line-glow{display:none;}
  }

  /* ---------- strategy modules ---------- */
  .module-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:900px){.module-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.module-grid{grid-template-columns:1fr;}}
  .module-card{
    padding:24px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--bg-panel); position:relative;
  }
  .module-card .n{font-family:var(--mono); font-size:11px; color:var(--green-bright); letter-spacing:0.14em;}
  .module-card h3{font-size:1.05rem; margin-top:10px; color:#fff;}
  .module-card p{font-size:13.5px; color:var(--ink-muted); margin-top:8px;}

  footer{border-top:1px solid var(--line); padding:36px 0; text-align:center; color:var(--ink-faint); font-family:var(--mono); font-size:11.5px; letter-spacing:0.08em;}

  /* labels set in the sans serif mono slot read better a touch heavier */
  .eyebrow, .nav-links button, .live-pill, .status-row, .stat span, .module-card .n, footer{font-weight:600;}

  .nav-brand{display:flex; align-items:center; gap:10px; text-decoration:none; background:none; border:none; padding:0;}
  .nav-brand img{height:22px; width:auto; display:block;}

</style>

<style>
  /* ---------- search overlay ---------- */
  .search-overlay{
    position:fixed; inset:0; z-index:100; background:rgba(7,9,10,0.82); backdrop-filter:blur(6px);
    display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
  }
  .search-overlay[hidden]{display:none;}
  .search-panel{
    width:min(560px, 90vw); background:var(--bg-panel-2); border:1px solid var(--line-bright);
    border-radius:var(--radius); box-shadow:0 30px 80px -20px rgba(0,0,0,0.6); overflow:hidden;
  }
  .search-input-row{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); color:var(--ink-muted);}
  .search-input-row input{
    flex:1; background:none; border:none; color:var(--ink); font-family:var(--body); font-size:15px; outline:none;
  }
  .search-input-row button{background:none; border:1px solid var(--line); color:var(--ink-faint); font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:6px;}
  .search-results{max-height:50vh; overflow-y:auto; padding:8px;}
  .search-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:9px;
    color:var(--ink-muted); font-size:13.5px;
  }
  .search-item:hover, .search-item:focus-visible{background:rgba(117,165,58,0.1); color:var(--ink);}
  .search-item b{color:var(--ink); font-weight:600;}
  .search-empty{padding:20px; text-align:center; color:var(--ink-faint); font-family:var(--mono); font-size:12px;}

  /* ---------- industry detail view ---------- */
  .ind-hero{padding:64px 0 40px; position:relative;}

    display:inline-flex; align-items:center; gap:8px; background:none; border:1px solid var(--line);

    padding:8px 14px; border-radius:100px; margin-bottom:28px; transition:border-color .2s ease, color .2s ease;
  }
  .back-btn:hover{border-color:var(--green); color:var(--ink);}

  .tabbar-fade{

  function wireTabs(){

    });

  function renderSearch(q){

  /* ================= HERO CANVAS (network nodes) ================= */

  function initHeroCanvas(){
    var canvas = document.getElementById('heroCanvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var w, h, nodes = [];
    var NODE_COUNT = 26;

    function resize(){
      var rect = canvas.parentElement.getBoundingClientRect();
      w = canvas.width = rect.width * devicePixelRatio;
      h = canvas.height = rect.height * devicePixelRatio;
      canvas.style.width = rect.width+'px';
      canvas.style.height = rect.height+'px';
    }
    function seed(){
      nodes = [];
      for(var i=0;i<NODE_COUNT;i++){
        nodes.push({
          x: Math.random()*w, y: Math.random()*h,
          vx: (Math.random()-0.5)*0.15*devicePixelRatio,
          vy: (Math.random()-0.5)*0.15*devicePixelRatio,
          r: (Math.random()*1.6+1)*devicePixelRatio
        });
      }
    }
    function step(){
      ctx.clearRect(0,0,w,h);
      nodes.forEach(function(n){
        n.x += n.vx; n.y += n.vy;
        if(n.x<0||n.x>w) n.vx*=-1;
        if(n.y<0||n.y>h) n.vy*=-1;
      });
      for(var i=0;i<nodes.length;i++){
        for(var j=i+1;j<nodes.length;j++){
          var a=nodes[i], b=nodes[j];
          var dx=a.x-b.x, dy=a.y-b.y;
          var dist = Math.sqrt(dx*dx+dy*dy);
          var maxDist = 150*devicePixelRatio;
          if(dist < maxDist){
            ctx.strokeStyle = 'rgba(117,165,58,'+(0.22*(1-dist/maxDist))+')';
            ctx.lineWidth = devicePixelRatio*0.7;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      nodes.forEach(function(n){
        ctx.beginPath();
        ctx.fillStyle = 'rgba(164,221,99,0.85)';
        ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
        ctx.fill();
      });
      if(!reduced) requestAnimationFrame(step);
    }
    resize(); seed();
    if(reduced){ step(); } else { step(); }
    window.addEventListener('resize', function(){ resize(); seed(); });
  }
